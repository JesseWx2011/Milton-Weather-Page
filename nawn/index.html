<!DOCTYPE html>
<html lang="en">
<head>
    <html xmlns="http://www.w3.org/1999/xhtml">
    <meta http-equiv="content-type" content="application/xhtml+xml; charset=ISO-8859-1">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesonet/PWS Weather Map</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Verdana, Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-family: Verdana, Roboto, sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
            transform: translateY(-2px);
        }

        .controls {
            padding: 20px 30px;
            background: #ecf0f1;
            border-bottom: 2px solid #bdc3c7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .parameter-display {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .parameter-label {
            font-weight: 600;
            color: #2c3e50;
            font-size: 16px;
        }

        .parameter-value {
            background: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            color: #3498db;
            border: 2px solid #3498db;
        }

        #map {
            height: 600px;
            width: 100%;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #7f8c8d;
        }

        .station-popup {
            font-family: Verdana, Roboto, sans-serif;
            min-width: 250px;
        }

        .popup-title {
            font-weight: 600;
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #3498db;
        }

        .popup-data {
            display: grid;
            gap: 6px;
            font-size: 13px;
        }

        .popup-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
        }

        .popup-label {
            font-weight: 600;
            color: #7f8c8d;
        }

        .popup-value {
            color: #2c3e50;
            font-weight: 500;
        }

        .popup-link {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ecf0f1;
        }

        .popup-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
        }

        .popup-link a:hover {
            text-decoration: underline;
        }

        .station-list {
            display: none;
            max-height: 500px;
            overflow-y: auto;
            padding: 20px 30px;
        }

        .station-list.active {
            display: block;
        }

        .station-item {
            background: white;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .station-item:hover {
            border-color: #3498db;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.2);
        }

        .station-item h3 {
            color: #2c3e50;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .station-item-data {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 8px;
            font-size: 13px;
        }

        .marker-label {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #3498db;
            border-radius: 4px;
            padding: 4px 8px;
            font-weight: 600;
            font-size: 12px;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            .controls {
                padding: 15px 20px;
            }

            #map {
                height: 400px;
            }

            .btn {
                padding: 8px 16px;
                font-size: 13px;
            }

            .station-list {
                padding: 15px 20px;
            }
        }
        a:hover  {
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Mesonet Weather Map</h1>
            <i>Data Originates from <a href="https://southeasternweather.net/">southeasternweather.net</a></i>
            <div class="button-group">
                <button class="btn btn-primary" id="toggleListBtn">Show Station List</button>
                <button class="btn btn-secondary" onclick="window.location.href='../'">← Back to Weather Dashboard</button>
            </div>
        </div>

        <div class="controls">
            <div class="parameter-display">
                <span class="parameter-label">Current Parameter:</span>
                <span class="parameter-value" id="currentParameter">Temperature</span>
            </div>
            <div>
                <span style="color: #7f8c8d; font-size: 14px;">Auto-cycling every 5 seconds</span>
            </div>
        </div>

        <div id="mapContainer">
            <div id="map"></div>
        </div>

        <div class="station-list" id="stationList">
            <h2 style="margin-bottom: 20px; color: #2c3e50;">Weather Stations</h2>
            <div id="stationListContent"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        let map;
        let markers = [];
        let stationData = [];
        let currentParameterIndex = 0;
        let cycleInterval;

        const parameters = [
            { name: 'Temperature', index: 2, unit: '' },
            { name: 'Humidity', index: 3, unit: '' },
            { name: 'Dew Point', index: 4, unit: '' },
            { name: 'Wind Direction', index: 5, unit: '' },
            { name: 'Wind Speed', index: 6, unit: '' },
            { name: 'Wind Gust', index: 7, unit: '' },
            { name: 'Rainfall', index: 8, unit: '' },
            { name: 'Pressure', index: 9, unit: '' }
        ];

        // Decode HTML entities like &deg; to °
        function decodeHTML(html) {
            const txt = document.createElement('textarea');
            txt.innerHTML = html;
            return txt.value;
        }

        function parseConditions(condsString) {
            const parts = condsString.split(',').map(part => decodeHTML(part));
            return {
                condition: parts[1] || 'N/A',
                temperature: parts[2] || 'N/A',
                humidity: parts[3] || 'N/A',
                dewpoint: parts[4] || 'N/A',
                windDir: parts[5] || 'N/A',
                windSpeed: parts[6] || 'N/A',
                windGust: parts[7] || 'N/A',
                rainfall: parts[8] || 'N/A',
                pressure: parts[9] || 'N/A',
                trend: parts[10] || 'N/A',
                time: parts[11] || 'N/A'
            };
        }

        function initMap() {
            map = L.map('map').setView([33.53, -83.17], 6);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 18
            }).addTo(map);
        }

        function createPopupContent(station, conds) {
            return `
                <div class="station-popup">
                    <div class="popup-title">${station.town}</div>
                    <div class="popup-data">
                        <div class="popup-row">
                            <span class="popup-label">Condition:</span>
                            <span class="popup-value">${conds.condition}</span>
                        </div>
                        <div class="popup-row">
                            <span class="popup-label">Temperature:</span>
                            <span class="popup-value">${conds.temperature}</span>
                        </div>
                        <div class="popup-row">
                            <span class="popup-label">Humidity:</span>
                            <span class="popup-value">${conds.humidity}</span>
                        </div>
                        <div class="popup-row">
                            <span class="popup-label">Dew Point:</span>
                            <span class="popup-value">${conds.dewpoint}</span>
                        </div>
                        <div class="popup-row">
                            <span class="popup-label">Wind:</span>
                            <span class="popup-value">${conds.windDir} ${conds.windSpeed}</span>
                        </div>
                        <div class="popup-row">
                            <span class="popup-label">Gust:</span>
                            <span class="popup-value">${conds.windGust}</span>
                        </div>
                        <div class="popup-row">
                            <span class="popup-label">Rainfall:</span>
                            <span class="popup-value">${conds.rainfall}</span>
                        </div>
                        <div class="popup-row">
                            <span class="popup-label">Pressure:</span>
                            <span class="popup-value">${conds.pressure} (${conds.trend})</span>
                        </div>
                        <div class="popup-row">
                            <span class="popup-label">Network:</span>
                            <span class="popup-value">${station.nets}</span>
                        </div>
                        <div class="popup-row">
                            <span class="popup-label">Updated:</span>
                            <span class="popup-value">${conds.time}</span>
                        </div>
                    </div>
                    <div class="popup-link">
                        <a href="${station.surl}" target="_blank">View Station Details →</a>
                    </div>
                </div>
            `;
        }

        function updateMarkers() {
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];

            const param = parameters[currentParameterIndex];
            document.getElementById('currentParameter').textContent = param.name;

            stationData.forEach(station => {
                const conds = parseConditions(station.conds);
                const condArray = station.conds.split(',').map(part => decodeHTML(part));
                const value = condArray[param.index] || 'N/A';

                const icon = L.divIcon({
                    className: 'marker-label',
                    html: `<div class="marker-label">${value}</div>`,
                    iconSize: null
                });

                const marker = L.marker([parseFloat(station.lat), parseFloat(station.long)], { icon })
                    .bindPopup(createPopupContent(station, conds))
                    .addTo(map);

                markers.push(marker);
            });
        }

        function startCycling() {
            cycleInterval = setInterval(() => {
                currentParameterIndex = (currentParameterIndex + 1) % parameters.length;
                updateMarkers();
            }, 5000);
        }

        function generateStationList() {
            const listContent = document.getElementById('stationListContent');
            listContent.innerHTML = '';

            stationData.forEach(station => {
                const conds = parseConditions(station.conds);
                const item = document.createElement('div');
                item.className = 'station-item';
                item.innerHTML = `
                    <h3>${station.town} <span style="color: #7f8c8d; font-weight: normal; font-size: 13px;">(${station.nets})</span></h3>
                    <div class="station-item-data">
                        <div><strong>Condition:</strong> ${conds.condition}</div>
                        <div><strong>Temperature:</strong> ${conds.temperature}</div>
                        <div><strong>Humidity:</strong> ${conds.humidity}</div>
                        <div><strong>Dew Point:</strong> ${conds.dewpoint}</div>
                        <div><strong>Wind:</strong> ${conds.windDir} ${conds.windSpeed}</div>
                        <div><strong>Gust:</strong> ${conds.windGust}</div>
                        <div><strong>Rainfall:</strong> ${conds.rainfall}</div>
                        <div><strong>Pressure:</strong> ${conds.pressure} (${conds.trend})</div>
                        <div><strong>Updated:</strong> ${conds.time}</div>
                        <div><a href="${station.surl}" target="_blank" style="color: #3498db; font-weight: 600;">View Station →</a></div>
                    </div>
                `;
                listContent.appendChild(item);
            });
        }

        async function loadData() {
            try {
                const response = await fetch('https://corsproxy.io/?url=https://southeasternweather.net/mesonet-map-json.php');
                const text = await response.text();
                
                const jsonMatch = text.match(/var data = (\{.*\});?/s);
                if (jsonMatch) {
                    const data = JSON.parse(jsonMatch[1]);
                    stationData = data.markers;
                    
                    updateMarkers();
                    generateStationList();
                    startCycling();
                } else {
                    document.getElementById('map').innerHTML = '<div class="loading">Error parsing data format</div>';
                }
            } catch (error) {
                document.getElementById('map').innerHTML = '<div class="loading">Error loading weather data. Please try again later.</div>';
                console.error('Error:', error);
            }
        }

        document.getElementById('toggleListBtn').addEventListener('click', function() {
            const list = document.getElementById('stationList');
            const mapContainer = document.getElementById('mapContainer');
            const btn = this;

            if (list.classList.contains('active')) {
                list.classList.remove('active');
                mapContainer.style.display = 'block';
                btn.textContent = 'Show Station List';
            } else {
                list.classList.add('active');
                mapContainer.style.display = 'none';
                btn.textContent = 'Show Map';
            }
        });

        initMap();
        loadData();
    </script>
</body>
</html>
