<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby METAR Observations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .metar-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .station-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            position: relative;
        }

        .station-card:hover {
            transform: scale(1.02);
        }

        .station-card .outdated-warning {
            position: absolute;
            top: 50px;
            right: 10px;
            background-color: rgba(255, 0, 0, 0.1);
            color: red;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .station-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .station-name {
            font-size: 1.2em;
            font-weight: bold;
        }

        .station-distance {
            color: #666;
            font-size: 0.9em;
        }

        .weather-icon {
            width: 80px;
            height: 80px;
            margin: 10px 0;
            border-radius: 10px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .detail-label {
            color: #666;
            font-size: 0.9em;
        }

        .detail-value {
            font-weight: bold;
        }

        .refresh-button {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        .refresh-button:hover {
            background-color: #1976D2;
        }

        .error-message {
            color: #f44336;
            text-align: center;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .metar-grid {
                grid-template-columns: 1fr;
            }
        }

        .outdated-warning {
            color: red;
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
        }

        .back-button {
            position: absolute;
            top: 50px;
            left: 130px;
            text-decoration: none;
            color: #3498db;
            display: inline-block;
            padding: 8px 16px;
            border-radius: 4px;
            background: rgba(52, 152, 219, 0.1);
            transition: all 0.3s;
            font-size: 14px;
            z-index: 1000;
        }

        .back-button:hover {
            background: rgba(52, 152, 219, 0.2);
            color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button" title="Back to main dashboard">Return to Weather Dashboard</a>

        <div class="header">
            <h1>Nearby METAR Observations</h1>
            <p>Nearby METAR Data within 75 miles from the Weather Station. </p>
            <div id="outdated-warning" class="outdated-warning" style="display: none;"></div>
            <button class="refresh-button" onclick="loadMetarData()">Refresh Data</button>
        </div>

        <div id="metar-grid" class="metar-grid">
            <!-- METAR data will be loaded here -->
        </div>
            <!-- USA Weather Finder Link -->
    <div class="weather-finder-link" align="center">
        <a href="https://usaweatherfinder.com/">
            <img src="https://usaweatherfinder.com/button.php?u=JesseLikesWeather" alt="USA Weather Finder" border="0">
        </a>
    </div>
    </div>

    <script>
        const MILTON_COORDS = {
            latitude: 30.6319,
            longitude: -87.0372199
        };

        // Function to calculate distance between two points in miles
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 3959; // Earth's radius in miles
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Function to fetch METAR data
        async function fetchMetarData() {
            try {
                // First get the grid endpoint for Milton
                const gridResponse = await fetch(`https://api.weather.gov/points/${MILTON_COORDS.latitude},${MILTON_COORDS.longitude}`);
                const gridData = await gridResponse.json();
                
                // Then get the stations for that grid
                const stationsResponse = await fetch(`https://api.weather.gov/gridpoints/${gridData.properties.gridId}/${gridData.properties.gridX},${gridData.properties.gridY}/stations`);
                const stationsData = await stationsResponse.json();
                
                // Filter stations to only include those with current observations and within 75 miles
                const activeStations = stationsData.features.filter(station => {
                    if (!station.properties.stationIdentifier || !station.properties.name) {
                        return false;
                    }
                    
                    const stationLat = station.geometry.coordinates[1];
                    const stationLon = station.geometry.coordinates[0];
                    const distance = calculateDistance(
                        MILTON_COORDS.latitude, 
                        MILTON_COORDS.longitude, 
                        stationLat, 
                        stationLon
                    );
                    
                    return distance <= 75;
                });
                
                // Sort stations by distance
                activeStations.sort((a, b) => {
                    const distA = calculateDistance(
                        MILTON_COORDS.latitude, 
                        MILTON_COORDS.longitude, 
                        a.geometry.coordinates[1], 
                        a.geometry.coordinates[0]
                    );
                    const distB = calculateDistance(
                        MILTON_COORDS.latitude, 
                        MILTON_COORDS.longitude, 
                        b.geometry.coordinates[1], 
                        b.geometry.coordinates[0]
                    );
                    return distA - distB;
                });
                
                return activeStations;
            } catch (error) {
                console.error('Error fetching METAR data:', error);
                throw error;
            }
        }

        // Function to get latest observation for a station
        async function getLatestObservation(stationId) {
            try {
                const response = await fetch(`https://api.weather.gov/stations/${stationId}/observations/latest`);
                const data = await response.json();
                return data;
            } catch (error) {
                console.error(`Error fetching observation for station ${stationId}:`, error);
                return null;
            }
        }

        function formatDateTime(date) {
            return date.toLocaleString('en-US', {
                timeZone: 'America/Chicago',
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
        }

        function checkDataAge(timestamp) {
            const now = new Date();
            const dataTime = new Date(timestamp);
            const threeHoursAgo = new Date(now.getTime() - (3 * 60 * 60 * 1000));
            
            const warningElement = document.getElementById('outdated-warning');
            if (dataTime < threeHoursAgo) {
                warningElement.textContent = `Outdated Weather Data, last updated ${formatDateTime(dataTime)}`;
                warningElement.style.display = 'block';
            } else {
                warningElement.style.display = 'none';
            }
        }

        // Function to load and display METAR data
        async function loadMetarData() {
            const metarGrid = document.getElementById('metar-grid');
            metarGrid.innerHTML = '<div class="error-message">Loading data...</div>';
            const useMetric = localStorage.getItem('useMetric') === 'true';

            try {
                const stations = await fetchMetarData();
                const stationCards = [];
                let latestTimestamp = null;
                let outdatedStations = [];

                for (const station of stations) {
                    const observation = await getLatestObservation(station.properties.stationIdentifier);
                    if (!observation) continue;

                    const observationTime = new Date(observation.properties.timestamp);
                    const threeHoursAgo = new Date(Date.now() - (3 * 60 * 60 * 1000));

                    // Check if this station's data is outdated
                    if (observationTime < threeHoursAgo) {
                        outdatedStations.push({
                            name: station.properties.name,
                            timestamp: observation.properties.timestamp
                        });
                    }

                    // Update latest timestamp if this observation is newer
                    if (!latestTimestamp || observationTime > new Date(latestTimestamp)) {
                        latestTimestamp = observation.properties.timestamp;
                    }

                    const distance = calculateDistance(
                        MILTON_COORDS.latitude,
                        MILTON_COORDS.longitude,
                        station.geometry.coordinates[1],
                        station.geometry.coordinates[0]
                    );

                    const properties = observation.properties;
                    const isOutdated = observationTime < threeHoursAgo;

                    // Convert values based on unit preference
                    const temp = properties.temperature.value ? (useMetric ? properties.temperature.value : (properties.temperature.value * 9/5) + 32) : null;
                    const dewPoint = properties.dewpoint.value ? (useMetric ? properties.dewpoint.value : (properties.dewpoint.value * 9/5) + 32) : null;
                    const windSpeed = properties.windSpeed.value ? (useMetric ? properties.windSpeed.value : properties.windSpeed.value * 2.23694) : null;
                    const visibility = properties.visibility.value ? (useMetric ? properties.visibility.value / 1000 : properties.visibility.value * 0.000621371) : null;
                    const pressure = properties.barometricPressure.value ? (useMetric ? properties.barometricPressure.value / 100 : properties.barometricPressure.value / 3386.39) : null;

                    const card = `
                        <div class="station-card">
                            ${isOutdated ? `<div class="outdated-warning">Outdated Data<br>Last updated ${formatDateTime(observationTime)}</div>` : ''}
                            <div class="station-header">
                                <div class="station-name">${station.properties.name}</div>
                                <div class="station-distance">${distance.toFixed(1)} miles away</div>
                            </div>
                            <img src="${properties.icon || 'NA.jpg'}" alt="Weather icon" class="weather-icon" onerror="this.src='NA.jpg'">
                            <div class="weather-details">
                                <div class="detail-item">
                                    <span class="detail-label">Temperature</span>
                                    <span class="detail-value">${temp !== null ? temp.toFixed(1) + (useMetric ? '°C' : '°F') : 'N/A'}</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Dew Point</span>
                                    <span class="detail-value">${dewPoint !== null ? dewPoint.toFixed(1) + (useMetric ? '°C' : '°F') : 'N/A'}</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Wind</span>
                                    <span class="detail-value">${windSpeed !== null ? windSpeed.toFixed(1) + (useMetric ? ' m/s' : ' mph') + ' ' + properties.windDirection.value + '°' : 'N/A'}</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Visibility</span>
                                    <span class="detail-value">${visibility !== null ? visibility.toFixed(1) + (useMetric ? ' km' : ' miles') : 'N/A'}</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Pressure</span>
                                    <span class="detail-value">${pressure !== null ? pressure.toFixed(2) + (useMetric ? ' hPa' : ' inHg') : 'N/A'}</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Relative Humidity</span>
                                    <span class="detail-value">${properties.relativeHumidity.value ? Math.round(properties.relativeHumidity.value) + '%' : 'N/A'}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    stationCards.push(card);
                }

                metarGrid.innerHTML = stationCards.join('');

                // Display warning for outdated stations
                const warningElement = document.getElementById('outdated-warning');
                if (outdatedStations.length > 0) {
                    const warningText = outdatedStations.map(station => 
                        `${station.name} (last updated ${formatDateTime(new Date(station.timestamp))})`
                    ).join('<br>');
                    warningElement.innerHTML = `Outdated Weather Data:<br>${warningText}`;
                    warningElement.style.display = 'block';
                } else {
                    warningElement.style.display = 'none';
                }
            } catch (error) {
                console.error('Error loading METAR data:', error);
                metarGrid.innerHTML = '<div class="error-message">Error loading data. Please try again later.</div>';
            }
        }

        // Load data when page loads
        document.addEventListener('DOMContentLoaded', loadMetarData);
    </script>
</body>
</html>
