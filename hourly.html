<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hourly Forecast - Milton Weather</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">    
<style>
        /* --- Global Settings --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333333;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .hourly-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- Header Section --- */
        .hourly-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eeeeee;
        }

        .hourly-header h1 {
            font-size: 2.2em;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            background-color: #f0f2f5;
            border-radius: 6px;
            text-decoration: none;
            color: #444;
            font-weight: 600;
            transition: background 0.2s;
        }

        .back-link:hover {
            background-color: #e4e6eb;
        }

        /* --- Location Selector --- */
        .location-selector {
            text-align: center;
            margin: 20px 0;
        }

        #location-dropdown {
            padding: 10px 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #ffffff;
            color: #333;
            cursor: pointer;
            min-width: 200px;
        }

        /* --- Forecast List Layout --- */
        .date-section {
            margin-bottom: 25px;
        }

        .date-header {
            font-size: 1.3em;
            font-weight: 700;
            background: #f8f9fa;
            padding: 12px 20px;
            border-radius: 8px 8px 0 0;
            border: 1px solid #e9ecef;
            color: #2c3e50;
        }

        .hourly-items-container {
            border: 1px solid #e9ecef;
            border-top: none;
            border-radius: 0 0 8px 8px;
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        /* --- The Forecast Row --- */
        .hourly-wrapper {
            border-bottom: 1px solid #eee;
        }
        .hourly-wrapper:last-child {
            border-bottom: none;
        }

        .hourly-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 25px;
            cursor: pointer;
            transition: background 0.2s;
            background: #fff;
        }

        .hourly-item:hover {
            background-color: #f0f7ff;
        }

        /* Active state for open drawer */
        .hourly-wrapper.active .hourly-item {
            background-color: #f0f7ff;
        }

        .hourly-wrapper.active .toggle-icon {
            transform: rotate(180deg);
        }

        /* --- Row Elements --- */
        .time {
            width: 100px;
            font-weight: bold;
            font-size: 1.1em;
            text-align: left;
        }

        .weather-icon-container {
            width: 50px;
            height: 50px;
            margin: 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .weather-icon {
            width: 100%;
            height: auto;
            border-radius: 4px;
        }

        .condition {
            flex-grow: 1;
            font-size: 1.05em;
            color: #555;
            text-align: left;
        }

        .temp {
            font-size: 1.6em;
            font-weight: 700;
            width: 80px;
            text-align: right;
            margin-right: 15px;
        }

        .toggle-icon {
            color: #aaa;
            transition: transform 0.3s ease;
            width: 20px;
            text-align: center;
        }

        /* --- The Drawer (Hidden Details) --- */
        .hourly-details {
            max-height: 0;
            overflow: hidden;
            background-color: #fcfcfc;
            transition: max-height 0.3s ease-out, padding 0.3s ease;
            display: flex;
            justify-content: center;
            gap: 40px;
            border-top: 1px solid transparent;
        }

        .hourly-wrapper.active .hourly-details {
            max-height: 100px;
            padding: 15px 25px;
            border-top: 1px solid #f0f0f0;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1em;
            color: #666;
        }

        .detail-item i {
            color: #3498db;
            font-size: 1.1em;
        }

        .error-message {
            color: #c0392b;
            text-align: center;
            padding: 20px;
            background: #fff5f5;
            border-radius: 8px;
        }

        /* --- Responsive --- */
        @media (max-width: 600px) {
            .hourly-item { padding: 12px 15px; flex-wrap: wrap; }
            .time { width: 70px; font-size: 0.9em; }
            .temp { font-size: 1.4em; width: auto; margin-left: auto; }
            .condition { width: 100%; margin-top: 5px; font-size: 0.9em; order: 4; text-align: left; padding-left: 90px; color: #777;}
            .weather-icon-container { margin: 0 10px; width: 40px; height: 40px; }
            
            .hourly-wrapper.active .hourly-details {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
                max-height: 150px;
            }
        }
    </style>
    </head>
<body>
    <div class="hourly-container">
        <a href="index.html" class="back-link">← Back to Dashboard</a>
        
        <div class="hourly-header">
            <h1>Hourly Forecast</h1>
            <div class="location-selector">
                <select id="location-dropdown">
                    <option value="Milton,FL">Milton, FL</option>
                    <option value="Pensacola,FL">Pensacola, FL</option>
                    <option value="HurlburtField,FL">Hurlburt Field, FL</option>
                    <option value="Baker,FL">Baker, FL</option>
                    <option value="Crestview,FL">Crestview, FL</option>
                    <option value="Navarre,FL">Navarre, FL</option>
                    <option value="EglinAFB,FL">Eglin AFB, FL</option>
                    <option value="FortWaltonBeach,FL">Fort Walton Beach, FL</option>
                    <option value="Destin,FL">Destin, FL</option>
                    <option value="GulfBreeze,FL">Gulf Breeze, FL</option>
                    <option value="Molino,FL">Molino, FL</option>
                    <option value="Century,FL">Century, FL</option>
                    <option value="LaurelHill,FL">Laurel Hill, FL</option>
                    <option value="GulfShores,AL">Gulf Shores, AL</option>
                    <option value="PanamaCity,FL">Panama City, FL</option>
                    <option value="Enterprise,AL">Enterprise, AL</option>
                    <option value="Tallahassee,FL">Tallahassee, FL</option>
                </select>
            </div>
            <p id="location-name">Milton, FL, USA</p>
        </div>

        <div class="hourly-grid" id="hourly-forecast">
            </div>
    </div>

    <script src="hourly.js"></script>

    <script>
        // This script handles the opening/closing of drawers. 
        // It uses "Event Delegation" so it works even on items added by hourly.js later.
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('.hourly-grid');
            
            container.addEventListener('click', function(e) {
                // Check if the click happened inside an .hourly-item
                const header = e.target.closest('.hourly-item');
                
                if (header) {
                    // Find the wrapper (parent of the header)
                    const wrapper = header.parentElement;
                    
                    // Toggle the 'active' class
                    wrapper.classList.toggle('active');
                }
            });
        });
    </script>

    <div class="weather-finder-link" style="text-align: center; margin-top: 40px;">
        <a href="https://usaweatherfinder.com/">
            <img src="https://usaweatherfinder.com/button.php?u=JesseLikesWeather" alt="USA Weather Finder" border="0">
        </a>
    </div>
</body>
</html>
