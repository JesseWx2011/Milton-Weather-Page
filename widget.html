<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Widget</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 12px;
        }

        .widget-container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            background: white;
            border-radius: 14px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            font-size: 14px;
        }

        .widget-header {
            background: linear-gradient(135deg, #4a90e2, #2c3e50);
            color: white;
            padding: 18px 16px;
            text-align: center;
        }

        .widget-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .widget-location {
            font-size: 14px;
            opacity: 0.9;
        }

        .widget-content {
            padding: 18px 16px 14px;
        }

        .widget-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 14px;
        }

        .widget-temp {
            font-size: 42px;
            font-weight: 700;
            line-height: 1;
        }

        .widget-icon {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .widget-icon i {
            font-size: 40px;
        }

        .widget-condition {
            margin-bottom: 14px;
            padding: 12px 14px;
            background: #f3f7ff;
            border-radius: 10px;
            font-weight: 600;
            color: #1f3f7d;
            text-align: center;
        }

        .widget-details {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }

        .widget-detail {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 12px;
            background: #f9fbff;
            border-radius: 12px;
            border: 1px solid #edf3f9;
        }

        .widget-detail-label {
            font-size: 12px;
            color: #6d7a8a;
            margin-bottom: 6px;
        }

        .widget-detail-value {
            font-size: 16px;
            font-weight: 700;
            color: #24324a;
        }

        .widget-update {
            font-size: 12px;
            color: #777;
            margin-top: 4px;
            text-align: center;
        }

        .widget-footer {
            background: #f0f3f7;
            padding: 12px 14px;
            text-align: center;
            font-size: 12px;
            color: #5a6772;
        }

        .widget-footer a {
            color: #2d72c4;
            text-decoration: none;
        }

        .widget-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 420px) {
            .widget-container {
                max-width: 100%;
            }

            .widget-main {
                flex-direction: column;
                align-items: flex-start;
            }

            .widget-icon {
                width: 100%;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="widget-container">
        <div class="widget-header">
            <div class="widget-title">Milton Weather Station</div>
            <div class="widget-location">Milton, FL, USA</div>
        </div>
        <div class="widget-content">
            <div class="widget-main">
                <div class="widget-temp" id="current-temp">--°F</div>
                <div class="widget-icon"><i class="fas fa-sun" id="weather-icon"></i></div>
            </div>
            <div class="widget-condition" id="condition-summary">Updating conditions...</div>
            <div class="widget-details">
                <div class="widget-detail">
                    <div class="widget-detail-label">Feels Like</div>
                    <div class="widget-detail-value" id="feels-like">--°F</div>
                </div>
                <div class="widget-detail">
                    <div class="widget-detail-label">Humidity</div>
                    <div class="widget-detail-value" id="humidity">--%</div>
                </div>
                <div class="widget-detail">
                    <div class="widget-detail-label">Wind</div>
                    <div class="widget-detail-value" id="wind">-- mph</div>
                </div>
                <div class="widget-detail">
                    <div class="widget-detail-label">Dew Point</div>
                    <div class="widget-detail-value" id="dew-point">--°F</div>
                </div>
                <div class="widget-detail">
                    <div class="widget-detail-label">UV Index</div>
                    <div class="widget-detail-value" id="uv-index">--</div>
                </div>
                <div class="widget-detail">
                    <div class="widget-detail-label">Solar Radiation</div>
                    <div class="widget-detail-value" id="solar-radiation">-- W/m²</div>
                </div>
                <div class="widget-detail">
                    <div class="widget-detail-label">Rain Today</div>
                    <div class="widget-detail-value" id="rain-today">-- in</div>
                </div>
                <div class="widget-detail">
                    <div class="widget-detail-label">Pressure</div>
                    <div class="widget-detail-value" id="pressure">-- inHg</div>
                </div>
            </div>
            <div class="widget-update" id="last-update">Last updated: --</div>
        </div>
        <div class="widget-footer">
            <a href="index.html" target="_blank">View Full Dashboard</a>
            <div class="widget-update">Powered by Ambient Weather & Weather.com</div>
        </div>
    </div>

    <script src="widget.js"></script>
</body>
</html>
