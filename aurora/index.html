<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora & Solar Activity</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        :root {
            --glow-color-green: #00ff00;
            --glow-color-yellow: #ffff00;
            --glow-color-red: #ff0000;
            --bg-color: #000;
            --text-color: #fff;
            --card-bg: rgba(20, 20, 40, 0.8);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: -1;
        }

        .starfield div {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            text-shadow: 0 0 10px var(--glow-color-green), 0 0 20px var(--glow-color-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { text-shadow: 0 0 10px #0f0, 0 0 20px #0f0; }
            50% { text-shadow: 0 0 20px #0f0, 0 0 40px #0f0; }
        }

        main {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--glow-color-green);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 0 15px var(--glow-color-green), 0 0 30px var(--glow-color-green);
            transition: box-shadow 0.5s, border-color 0.5s;
            flex: 1 1 300px;
            min-width: 280px;
        }
        
        .chart-card {
            flex-basis: 100%;
        }

        .card h2 {
            margin-top: 0;
            text-shadow: 0 0 5px var(--glow-color-green);
        }

        #chart-buttons {
            margin-bottom: 1rem;
        }

        #chart-buttons button {
            background: var(--card-bg);
            border: 1px solid var(--glow-color-green);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            margin: 0 0.25rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s, box-shadow 0.3s;
        }

        #chart-buttons button:hover, #chart-buttons button.active {
            background: var(--glow-color-green);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--glow-color-green);
        }

        .kp-gauge {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 1rem;
        }

        .kp-gauge-circle {
            stroke-width: 15;
            fill: none;
        }

        .kp-gauge-bg {
            stroke: #333;
        }

        .kp-gauge-fg {
            stroke: var(--glow-color-green);
            stroke-dasharray: 502.65; /* 2 * PI * 80 */
            stroke-dashoffset: 502.65;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 1s, stroke 0.5s;
        }

        .kp-value {
            font-size: 2.5rem;
            font-weight: bold;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .kp-time, .kp-1-min-time {
            font-size: 1rem;
            color: #aaa;
        }
        
        .kp-time h4, .kp-time div, .kp-1-min-time h4 {
            margin: 0;
            padding: 0;
        }

        #kp-1-min {
            margin-top: 1rem;
            font-size: 1.2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 0.5rem;
            text-align: left;
            border-bottom: 1px solid rgba(0, 255, 0, 0.3);
        }

        th {
            text-shadow: 0 0 3px var(--glow-color-green);
        }

        #solar-wind-data ul {
            list-style: none;
            padding: 0;
        }

        #solar-wind-data li {
            margin-bottom: 0.5rem;
        }

        @media (max-width: 768px) {
            main {
                flex-direction: column;
                align-items: center;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            .card {
                padding: 1rem;
            }
            .kp-gauge {
                width: 150px;
                height: 150px;
            }
            .kp-value {
                font-size: 2rem;
            }
        }
        #top-menu {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 1rem;
}

#top-menu button {
    background: var(--card-bg);
    border: 1px solid var(--glow-color-green);
    color: var(--text-color);
    padding: 0.5rem 1rem;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.3s, box-shadow 0.3s;
}

#top-menu button:hover {
    background: var(--glow-color-green);
    color: var(--bg-color);
    box-shadow: 0 0 10px var(--glow-color-green);
}

    </style>
</head>
<body>

    <div class="starfield"></div>
<nav id="top-menu">
    <button onclick="location.href='../'">Back to Weather Dashboard</button>
    <button onclick="location.href='./webcams.html'">Webcams</button>
</nav>
    <header>
        <h1>Aurora & Solar Activity</h1>
    </header>

    <main>
        <div class="card chart-card">
            <h2>Real-time Solar Wind & Kp Index</h2>
            <div id="chart-buttons">
                <button data-duration="168">7d</button>
                <button data-duration="72">3d</button>
                <button data-duration="24" class="active">24h</button>
                <button data-duration="6">6h</button>
                <button data-duration="3">3h</button>
            </div>
            <canvas id="solar-chart"></canvas>
        </div>

        <div class="card" id="kp-card">
            <h2>Planetary K-index (3-hour)</h2>
            <div class="kp-gauge">
                <svg width="100%" height="100%" viewBox="0 0 200 200">
                    <circle class="kp-gauge-circle kp-gauge-bg" cx="100" cy="100" r="80"></circle>
                    <circle class="kp-gauge-circle kp-gauge-fg" id="kp-gauge-fg" cx="100" cy="100" r="80"></circle>
                </svg>
                <div class="kp-value" id="kp-value">--</div>
            </div>
            <div class="kp-time" id="kp-time">
                <h4>Loading...</h4>
            </div>
            <div id="kp-1-min">
                <h4>Loading 1-min Kp...</h4>
            </div>
        </div>

        <div class="card" id="solar-wind-card">
            <h2>Solar Wind</h2>
            <div id="solar-wind-data">Loading...</div>
        </div>

        <div class="card" id="solar-regions-card">
            <h2>Active Solar Regions</h2>
            <div id="solar-regions-data">Loading...</div>
        </div>

        <div class="card" id="sunspot-report-card">
            <h2>Sunspot Report</h2>
            <div id="sunspot-report-data">Loading...</div>
        </div>
    </main>

        <div class="weather-finder-link" style="margin-top: 20px;">
        <a href="https://usaweatherfinder.com/">
            <img src="https://usaweatherfinder.com/button.php?u=JesseLikesWeather" alt="USA Weather Finder" border="0">
        </a>
    </div>
    <script>
        const solarWindData = {};
        let solarChart;
        let fullKpData, fullWindData;

        function createStars() {
            const starfield = document.querySelector('.starfield');
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.animationDuration = `${Math.random() * 3 + 2}s`;
                star.style.animationDelay = `${Math.random() * 3}s`;
                starfield.appendChild(star);
            }
        }

        async function fetchData(url, updater, errorHandler) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                updater(data);
            } catch (error) {
                errorHandler(error);
            }
        }
        
        function initChart() {
            const ctx = document.getElementById('solar-chart').getContext('2d');
            solarChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [
                        { label: 'Kp Index', borderColor: '#ff00ff', yAxisID: 'yKp', tension: 0.1 },
                        { label: 'Solar Wind Speed', borderColor: '#00ffff', yAxisID: 'ySpeed', tension: 0.1 },
                        { label: 'Solar Wind Density', borderColor: '#ffff00', yAxisID: 'yDensity', tension: 0.1 },
                        { label: 'Bz', borderColor: '#ff0000', yAxisID: 'yBz', tension: 0.1 }
                    ]
                },
                options: {
                    scales: {
                        x: { type: 'time', time: { unit: 'hour' }, ticks: { color: '#fff' } },
                        yKp: { position: 'left', min: 0, max: 9, ticks: { color: '#ff00ff' } },
                        ySpeed: { position: 'right', ticks: { color: '#00ffff' } },
                        yDensity: { position: 'right', ticks: { color: '#ffff00' } },
                        yBz: { position: 'left', ticks: { color: '#ff0000' } }
                    },
                    plugins: { legend: { labels: { color: '#fff' } } }
                }
            });
        }
        // Downsamples the data array to maxPoints evenly spaced points
function sampleData(data, maxPoints = 150) {
    if (data.length <= maxPoints) return data;
    const sampled = [];
    const step = data.length / maxPoints;
    for (let i = 0; i < data.length; i += step) {
        sampled.push(data[Math.floor(i)]);
    }
    return sampled;
}


        function updateChartDuration(hours) {
            if (!solarChart || !fullKpData || !fullWindData) return;

            const now = new Date();
            const startTime = new Date(now.getTime() - hours * 60 * 60 * 1000);

            const filterDataByTime = (data) => data.slice(1).filter(row => new Date(row[0] + 'Z') >= startTime);

            const filteredKpData = filterDataByTime(fullKpData);
            const filteredWindData = filterDataByTime(fullWindData);

            const sampledKpData = sampleData(filteredKpData, 150);
            const sampledWindData = sampleData(filteredWindData, 150);

            const kpLabels = sampledKpData.map(row => new Date(row[0] + 'Z'));
            const kpValues = sampledKpData.map(row => parseFloat(row[1]));

            const windLabels = sampledWindData.map(row => new Date(row[0] + 'Z'));
            const speedValues = sampledWindData.map(row => parseFloat(row[1]));
            const densityValues = sampledWindData.map(row => parseFloat(row[2]));
            const bzValues = sampledWindData.map(row => parseFloat(row[6]));

            solarChart.data.labels = windLabels;
            solarChart.data.datasets[0].data = kpValues;
            solarChart.data.datasets[1].data = speedValues;
            solarChart.data.datasets[2].data = densityValues;
            solarChart.data.datasets[3].data = bzValues;
            solarChart.update();
        }

        function updateKpIndexUI(data) {
            if (!data || data.length < 2) return;
            fullKpData = data;
            const latestData = data[data.length - 1];
            const timeTag = latestData[0];
            const kpValue = parseFloat(latestData[1]);

            document.getElementById('kp-value').innerText = kpValue.toFixed(2);
            
            const date = new Date(timeTag + 'Z');
            const startTime = date.getUTCHours();
            const endTime = (startTime + 3) % 24;
            const timeString = `<h4>${startTime.toString().padStart(2, '0')}:00 - ${endTime.toString().padStart(2, '0')}:00 UTC</h4>`;
            document.getElementById('kp-time').innerHTML = timeString;

            const gaugeFg = document.getElementById('kp-gauge-fg');
            const card = document.getElementById('kp-card');
            const circumference = 2 * Math.PI * 80;
            const offset = circumference - (kpValue / 9) * circumference;
            gaugeFg.style.strokeDashoffset = offset;

            let color, shadowColor;
            if (kpValue >= 6) {
                color = 'var(--glow-color-red)';
            } else if (kpValue >= 4) {
                color = 'var(--glow-color-yellow)';
            } else {
                color = 'var(--glow-color-green)';
            }
            shadowColor = color;

            gaugeFg.style.stroke = color;
            card.style.borderColor = color;
            card.style.boxShadow = `0 0 15px ${shadowColor}, 0 0 30px ${shadowColor}`;
            document.querySelector('#kp-card h2').style.textShadow = `0 0 5px ${shadowColor}`;
        }

        function updateKp1MinUI(data) {
            if (!data || data.length === 0) return;
            const latestData = data[data.length - 1];
            const kpValue = parseFloat(latestData.estimated_kp);
            document.getElementById('kp-1-min').innerHTML = `<h4>1-Min Kp: ${kpValue.toFixed(2)}</h4>`;
        }

        function updateSolarRegionsUI(data) {
            const container = document.getElementById('solar-regions-data');
            if (!data || data.length === 0) {
                container.innerHTML = 'No active regions reported.';
                return;
            }
            let table = '<table><thead><tr><th>Region</th><th>Location</th><th>Class</th></tr></thead><tbody>';
            const recentRegions = data.filter(r => new Date(r.observed_date) > new Date(new Date().setDate(new Date().getDate()-2)))
                                     .sort((a,b) => b.area - a.area)
                                     .slice(0, 10);
            for (const region of recentRegions) {
                table += `<tr><td>${region.region}</td><td>${region.location}</td><td>${region.spot_class}</td></tr>`;
            }
            table += '</tbody></table>';
            container.innerHTML = table;
        }

        function updateSunspotReportUI(data) {
            const container = document.getElementById('sunspot-report-data');
            if (!data || data.length === 0) {
                container.innerHTML = 'No sunspot report available.';
                return;
            }
            const latestReport = data.sort((a, b) => b.Area - a.Area).slice(0, 10);
            let table = '<table><thead><tr><th>Region</th><th>Class</th><th>Location</th></tr></thead><tbody>';
            for (const report of latestReport) {
                table += `<tr><td>${report.Region || 'N/A'}</td><td>${report.Spotclass}</td><td>${report.Location}</td></tr>`;
            }
            table += '</tbody></table>';
            container.innerHTML = table;
        }

        function updateSolarWindUI(data) {
            if (!data || data.length < 2) return;
            fullWindData = data;
            const latest = data[data.length-1];
            solarWindData.propagated = { speed: latest[1], density: latest[2], temperature: latest[3] };
            if (solarWindData.magField) {
                 const container = document.getElementById('solar-wind-data');
                const wind = solarWindData.propagated;
                const field = solarWindData.magField;
                const content = `
                    <ul>
                        <li>Speed: ${parseFloat(wind.speed).toFixed(2)} km/s</li>
                        <li>Density: ${parseFloat(wind.density).toFixed(2)} p/cm³</li>
                        <li>Temperature: ${parseFloat(wind.temperature).toFixed(0)} K</li>
                        <li>Bt: ${field.Bt} nT</li>
                        <li>Bz: ${field.Bz} nT</li>
                    </ul>
                `;
                container.innerHTML = content;
            }
        }

        function handleError(elementId, error) {
            console.error(`Failed to fetch data for ${elementId}:`, error);
            document.getElementById(elementId).innerHTML = '<h4>Could not fetch data</h4>';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            createStars();
            initChart();
            
            const urls = {
                kpIndex: 'https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json',
                kp1Min: 'https://services.swpc.noaa.gov/json/planetary_k_index_1m.json',
                solarRegions: 'https://services.swpc.noaa.gov/json/solar_regions.json',
                sunspotReport: 'https://services.swpc.noaa.gov/json/sunspot_report.json',
                propagatedSolarWind: 'https://services.swpc.noaa.gov/products/geospace/propagated-solar-wind.json',
                magField: 'https://services.swpc.noaa.gov/products/summary/solar-wind-mag-field.json'
            };

            fetchData(urls.kpIndex, updateKpIndexUI, (e) => handleError('kp-time', e));
            fetchData(urls.kp1Min, updateKp1MinUI, (e) => handleError('kp-1-min', e));
            fetchData(urls.solarRegions, updateSolarRegionsUI, (e) => handleError('solar-regions-data', e));
            fetchData(urls.sunspotReport, updateSunspotReportUI, (e) => handleError('sunspot-report-data', e));
            fetchData(urls.propagatedSolarWind, updateSolarWindUI, (e) => handleError('solar-wind-data', e));
            fetchData(urls.magField, (data) => {
                solarWindData.magField = data;
                // Do not call updateSolarWindUI here, it's called by the other fetch
            }, (e) => handleError('solar-wind-data', e));

            // Initial chart update
            const [kpResponse, windResponse] = await Promise.all([fetch(urls.kpIndex), fetch(urls.propagatedSolarWind)]);
            fullKpData = await kpResponse.json();
            fullWindData = await windResponse.json();
            updateChartDuration(24);

            document.getElementById('chart-buttons').addEventListener('click', (event) => {
                if (event.target.tagName === 'BUTTON') {
                    const duration = Number(event.target.dataset.duration);
                    updateChartDuration(duration);
                    document.querySelectorAll('#chart-buttons button').forEach(btn => btn.classList.remove('active'));
                    event.target.classList.add('active');
                }
            });

            setInterval(() => fetchData(urls.kpIndex, updateKpIndexUI, (e) => handleError('kp-time', e)), 60000);
            setInterval(() => fetchData(urls.kp1Min, updateKp1MinUI, (e) => handleError('kp-1-min', e)), 60000);
            setInterval(() => fetchData(urls.solarRegions, updateSolarRegionsUI, (e) => handleError('solar-regions-data', e)), 300000);
            setInterval(() => fetchData(urls.sunspotReport, updateSunspotReportUI, (e) => handleError('sunspot-report-data', e)), 300000);
            setInterval(() => fetchData(urls.propagatedSolarWind, updateSolarWindUI, (e) => handleError('solar-wind-data', e)), 60000);
            setInterval(() => fetchData(urls.magField, (data) => {
                solarWindData.magField = data;
            }, (e) => handleError('solar-wind-data', e)), 60000);
        });
    </script>

</body>
</html>
