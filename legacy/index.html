<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milton Weather Dashboard - Legacy</title>
  <link rel="stylesheet" href="./styles.css">

  <meta name="date" content="2025-11-15"/>
  <meta name="author" content="JesseLikesWeather"/>
</head>
<body>
        <button class="back-button" onclick="location.href='../'">Back to Weather Dashboard</button>

    <h1 class="title">Milton Weather Dashboard</h1>
    <h2 class="subtitle">Last Update: Loading...</h2>
    <div class="container">
        <table class="weather-grid">
            <tr>
                <td class="weather-cell">
                    <h3>Temperature:</h3>
                    <h4 id="temp">N/A°F</h4>
                </td>
                <td class="weather-cell">
                    <h3>Humidity:</h3>
                    <h4 id="humidity">N/A%</h4>
                </td>
                <td class="weather-cell">
                    <h3>Weather:</h3>
                    <h4 id="weather">In the works.</h4>
                </td>
            </tr>
            <tr>
                <td class="weather-cell">
                    <h3>Baro Pressure:</h3>
                    <h4 id="pressure">N/A</h4>
                </td>
                <td class="weather-cell">
                    <h3>Dew Point:</h3>
                    <h4 id="dewpoint">N/A°F</h4>
                </td>
                <td class="weather-cell">
                    <h3>Feels Like:</h3>
                    <h4 id="feelslike">N/A°F</h4>
                </td>
            </tr>
            <tr>
                <td class="weather-cell">
                    <h3>UV Index:</h3>
                    <h4 id="uv">N/A</h4>
                </td>
                <td class="weather-cell" colspan="2">
                    <h3>Solar Radiation:</h3>
                    <h4 id="solar">N/A W/m²</h4>
                </td>
            </tr>
            <tr>
                <td class="weather-cell" colspan="2">
                    <h3>Rain Today:</h3>
                    <h4 id="rain">N/A</h4>
                </td>
                <td class="weather-cell" colspan="1">
                    <h3>Current Wind:</h3>
                    <h4 id="wind">N/A mph</h4>
                </td>
            </tr>
        </table>
    </div>
    
    <div class="image-container">
        <div class="image-row">
            <table>
                <tr>
                    <td class="image-section">
                        <h2>Current Radar</h2>
                        <img src="https://raw.githubusercontent.com/JesseWx2011/Lightning-Map/refs/heads/master/docs/radar_maps/EVX.gif" style="height: 451.9px;" alt="KMOB Radar">
                    </td>
                    <td class="image-section">
                        <h2>Rip Current Risk</h2>
                        <img src="http://www.weather.gov/images//mob/graphicast/image30.png" alt="Rip Current Risk">
                    </td>
                </tr>
            </table>
        </div>
        <script type="text/javascript" src="./script.js"></script>
</body>
</html>
