<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Event Log</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12"></script>
    <link rel="icon" type="image/png" sizes="512x512" href="Favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .event-list {
            list-style-type: none;
            padding: 0;
        }

        .event-list li {
            margin: 10px 0;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: #3498db;
            display: inline-block;
            padding: 8px 16px;
            border-radius: 4px;
            background: rgba(52, 152, 219, 0.1);
            transition: all 0.3s;
            font-size: 14px;
            z-index: 1000;
        }

        .back-button:hover {
            background: rgba(52, 152, 219, 0.2);
            color: #2980b9;
        }

        .event-button {
            color: #3498db;
            display: inline-block;
            border-radius: 4px;
            padding: 8px 16px;
            border-radius: 4px;
            background: rgba(52, 152, 219, 0.1);
            transition: all 0.3s;
            font-size: 14px;
            z-index: 1000;
            cursor: pointer;
        }

        .event-button:hover {
            background: rgba(52, 152, 219, 0.2);
            color: #2980b9;
        }        

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Weather Event Log</h1>
            <h2>This is a list of significant weather events that I recorded & logged in the past. Take a look!</h2>
            <ul class="event-list">
                <li><button class="event-button" onclick="location.href='jan-21-2025-blizzard.html'">January 21st 2025 Blizzard</button></li>
            </ul>
            <a href="../index.html" class="back-button" title="Back to main dashboard">Return to Weather Dashboard</a>
        </div>
    </div>
</body>
</html>
