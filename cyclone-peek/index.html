<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyclone Peek - Tropical Weather Program</title>
    <link href="../styles.css" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            width: 100vw;
            overflow: hidden;
            background: #101820;
            font-family: 'Roboto', 'Verdana', sans-serif;
        }

        #cyclone-map {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .cyclone-menu {
            width: 25%;
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(30, 40, 60, 0.95);
            border-radius: 10px;
            box-shadow: 0 2px 8px #0006;
            padding: 0.5rem 1rem 1rem 1rem;
            font-family: 'Roboto', 'Verdana', sans-serif;
        }

        .cyclone-menu select {
            width: 100%;
            padding: 0.5rem;
            border-radius: 6px;
            border: none;
            font-size: 1rem;
            background: #222c3c;
            color: #fff;
            margin-bottom: 0.5rem;
            font-family: 'Roboto', 'Verdana', sans-serif;
        }

        .cyclone-btn {
            width: 100%;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #2196F3 0%, #1769aa 100%);
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 0.7rem 2rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
            box-shadow: 0 2px 8px #0002;
            font-family: 'Roboto', 'Verdana', sans-serif;
        }

        .cyclone-btn:hover {
            background: linear-gradient(90deg, #1769aa 0%, #2196F3 100%);
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 4px 16px #0004;
        }

        .mapboxgl-ctrl-top-right {
            top: 20px !important;
            right: 20px !important;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 15;
            background: linear-gradient(90deg, #ff6b35 0%, #f7931e 100%);
            color: #fff;
            border: none;
            border-radius: 25px;
            padding: 0.8rem 1.5rem;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
            box-shadow: 0 2px 8px #0004;
            font-family: 'Roboto', 'Verdana', sans-serif;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: linear-gradient(90deg, #f7931e 0%, #ff6b35 100%);
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 4px 16px #0006;
            color: #fff;
            text-decoration: none;
        }

        /* Modal Styles */
        .cyclone-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(.4, 0, .2, 1);
        }

        .cyclone-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .cyclone-modal-content {
            background: #232b3b;
            border-radius: 16px;
            box-shadow: 0 8px 32px #0007;
            padding: 2rem 2.5rem;
            max-width: 53vw;
            max-height: 80vh;
            overflow-y: auto;
            color: #fff;
            font-size: 1.08rem;
            font-family: 'Roboto', 'Verdana', sans-serif;
            transform: translateY(40px) scale(0.98);
            opacity: 0;
            transition: all 0.35s cubic-bezier(.4, 0, .2, 1);
        }

        .cyclone-modal.active .cyclone-modal-content {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .cyclone-modal-close {
            position: absolute;
            top: 18px;
            right: 28px;
            font-size: 2rem;
            color: #ffffff;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 101;
            font-family: 'Roboto', 'Verdana', sans-serif;
            transition: color 0.2s;
        }

        .cyclone-modal-close:hover {
            color: #ffffff;
        }

        .cyclone-modal-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #ffffff;
            font-family: 'Roboto', 'Verdana', sans-serif;
        }

        .cyclone-sat-panel {
            position: fixed;
            left: 24px;
            bottom: 24px;
            z-index: 20;
            background: rgba(30,40,60,0.95);
            border-radius: 12px;
            box-shadow: 0 2px 8px #0006;
            padding: 0.7em 1.2em;
            display: flex;
            gap: 0.7em;
            align-items: center;
        }
        .sat-btn {
            background: #232b3b;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.5em 1.2em;
            font-size: 1em;
            font-family: 'Roboto', 'Verdana', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
            box-shadow: 0 1px 4px #0002;
        }
        .sat-btn.active, .sat-btn:focus {
            background: #2196F3;
            color: #fff;
            outline: none;
        }
        .sat-btn:hover:not(.active) {
            background: #1769aa;
            color: #fff;
        }

        @media (max-width: 700px) {
            .cyclone-modal-content {
                padding: 1rem 0.5rem;
            }

            .cyclone-menu {
                min-width: 140px;
                padding: 0.5rem 0.5rem 1rem 0.5rem;
            }
            .cyclone-sat-panel {
                left: 8px;
                bottom: 8px;
                padding: 0.4em 0.5em;
                gap: 0.3em;
            }
            .sat-btn {
                padding: 0.3em 0.7em;
                font-size: 0.95em;
            }
            .back-btn {
                top: 10px;
                right: 10px;
                padding: 0.6rem 1.2rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>
    <div id="cyclone-map"></div>
    <a href="../index.html" class="back-btn">← Back to Weather Dashboard</a>
    <div class="cyclone-menu">
        <select id="cyclone-dropdown">
            <option value="wp" selected>West Pacific Cyclones/Outlooks</option>
            <option value="storms">List Current Storms</option>
            <option value="discussion">Current NHC Discussion</option>
            <option value="disturbances">List Current Disturbances</option>
        </select>
        <button class="cyclone-btn" id="refresh-btn">Refresh Data</button>
    </div>
    <div class="cyclone-sat-panel" id="cyclone-sat-panel">
      <button class="sat-btn" id="sat-btn-none">None</button>
      <button class="sat-btn" id="sat-btn-ir">IR</button>
      <button class="sat-btn" id="sat-btn-vis">Visible</button>
      <button class="sat-btn" id="sat-btn-wv">Water Vapor</button>
    </div>
    <div class="cyclone-modal" id="cyclone-modal">
        <div class="cyclone-modal-content">
            <button class="cyclone-modal-close" id="cyclone-modal-close" title="Close">&times;</button>
            <div class="cyclone-modal-title" id="cyclone-modal-title"></div>
            <div id="cyclone-modal-body"></div>
        </div>
    </div>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script src="cyclone-peek.js"></script>
</body>

</html>
