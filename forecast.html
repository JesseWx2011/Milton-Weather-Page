<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-Day Forecast 30.59°N 86.94°W (Text-Only)</title>
    <link rel="icon" type="image/png" sizes="512x512" href="Favicon.png">
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1300px;
            margin: 25px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .forecast-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .forecast-table th, .forecast-table td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: left;
        }

        .forecast {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            list-style-type: none;
            padding: 0;
        }

        .forecast-tombstone {
            width: 165px;
            margin: 5px;
            flex: 1 1 15px;
            text-align: center;
        }

        .forecast-icon {
            width: 50px;
            height: 50px;
        }

        .txt-ctr-caps {
            text-transform: capitalize;
            font-weight: bold;
        }

        .warn {
            color: red;
            font-weight: bold;
        }

        .daytime, .nighttime {
            display: flex; /* Use flexbox for horizontal layout */
            justify-content: space-around; /* Space items evenly */
            margin-bottom: 20px; /* Space between daytime and nighttime sections */
        }
        .back-button {
            position: absolute;
            top: 50px;
            left: 130px;
            text-decoration: none;
            color: #3498db;
            display: inline-block;
            padding: 8px 16px;
            border-radius: 4px;
            background: rgba(52, 152, 219, 0.1);
            transition: all 0.3s;
            font-size: 14px;
            z-index: 1000;
        }

        .back-button:hover {
            background: rgba(52, 152, 219, 0.2);
            color: #2980b9;
        }

        .location-selector {
            text-align: center;
            margin: 20px 0;
        }

        #location-dropdown {
            padding: 8px 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: white;
            cursor: pointer;
            min-width: 200px;
        }

        #location-dropdown:hover {
            border-color: #3498db;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button" title="Back to main dashboard">Return to Weather Dashboard</a>

        <h1>NWS Forecast for: <span id="location-name">Milton, FL</span></h1>
        <div class="location-selector">
            <select id="location-dropdown">
                <option value="">- Select Forecast -</option>
                <option value="Milton,FL">Milton, FL</option>
                <option value="Pensacola,FL">Pensacola, FL</option>
                <option value="HurlburtField,FL">Hurlburt Field, FL</option>
                <option value="Baker,FL">Baker, FL</option>
                <option value="Crestview,FL">Crestview, FL</option>
                <option value="Navarre,FL">Navarre, FL</option>
                <option value="EglinAFB,FL">Eglin AFB, FL</option>
                <option value="FortWaltonBeach,FL">Fort Walton Beach, FL</option>
                <option value="Destin,FL">Destin, FL</option>
                <option value="GulfBreeze,FL">Gulf Breeze, FL</option>
                <option value="Molino,FL">Molino, FL</option>
                <option value="Century,FL">Century, FL</option>
                <option value="LaurelHill,FL">Laurel Hill, FL</option>
                <option value="GulfShores,AL">Gulf Shores, AL</option>
                <option value="PanamaCity,FL">Panama City, FL</option>
                <option value="Enterprise,AL">Enterprise, AL</option>
                <option value="Tallahassee,FL">Tallahassee, FL</option>
            </select>
        </div>
        <p>Issued by: National Weather Service Mobile, AL</p>
        <p id="last-update"><a href="https://www.weather.gov/glossary/index.php?word=Last+update"><b>Last Update: </b></a>3:14 pm CDT Apr 21, 2025</p>
        
        <table class="forecast-table">
            <tbody>
                <tr>
                    <td colspan="2" align="center">
                        <hr>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <div class="daytime">
                            <ul class="forecast">
                                <!-- Daytime forecast items will be dynamically added here -->
                            </ul>
                        </div>
                        <div class="nighttime">
                            <ul class="forecast">
                                <!-- Nighttime forecast items will be dynamically added here -->
                            </ul>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" align="left">
                        Milton, FL<br>
                        30.68°N 87.03°W (Elev. 66 ft)<br>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" align="left">
                        Visit your local NWS office at: <a href="https://www.weather.gov/mob">https://www.weather.gov/mob</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // Location coordinates mapping
        const locationCoordinates = {
            'Milton,FL': { lat: 30.68, lon: 87.03, grid: 'MOB/90,67', office: 'Mobile' },
            'Pensacola,FL': { lat: 30.42, lon: 87.22, grid: 'MOB/91,66', office: 'Mobile' },
            'HurlburtField,FL': { lat: 30.43, lon: 86.68, grid: 'MOB/88,66', office: 'Mobile' },
            'Baker,FL': { lat: 30.80, lon: 86.68, grid: 'MOB/88,68', office: 'Mobile' },
            'Crestview,FL': { lat: 30.76, lon: 86.57, grid: 'MOB/87,68', office: 'Mobile' },
            'Navarre,FL': { lat: 30.40, lon: 86.86, grid: 'MOB/89,66', office: 'Mobile' },
            'EglinAFB,FL': { lat: 30.46, lon: 86.56, grid: 'MOB/87,66', office: 'Mobile' },
            'FortWaltonBeach,FL': { lat: 30.41, lon: 86.62, grid: 'MOB/87,66', office: 'Mobile' },
            'Destin,FL': { lat: 30.39, lon: 86.50, grid: 'MOB/86,66', office: 'Mobile' },
            'GulfBreeze,FL': { lat: 30.36, lon: 87.16, grid: 'MOB/90,66', office: 'Mobile' },
            'Molino,FL': { lat: 30.72, lon: 87.31, grid: 'MOB/91,68', office: 'Mobile' },
            'Century,FL': { lat: 30.97, lon: 87.26, grid: 'MOB/91,70', office: 'Mobile' },
            'LaurelHill,FL': { lat: 30.96, lon: 86.45, grid: 'MOB/87,70', office: 'Mobile' },
            'GulfShores,AL': { lat: 30.25, lon: 87.70, grid: 'MOB/93,65', office: 'Mobile' },
            'PanamaCity,FL': { lat: 30.16, lon: 85.66, grid: 'TAE/84,65', office: 'Tallahassee' },
            'Enterprise,AL': { lat: 31.32, lon: 85.85, grid: 'TAE/85,72', office: 'Tallahassee' },
            'Tallahassee,FL': { lat: 30.44, lon: 84.28, grid: 'TAE/115,91', office: 'Tallahassee' }
        };

        // Function to get NWS office URL
        function getNwsOfficeUrl(office) {
            const officeUrls = {
                'Mobile': 'https://www.weather.gov/mob',
                'Tallahassee': 'https://www.weather.gov/tae'
            };
            return officeUrls[office] || 'https://www.weather.gov';
        }

        // Function to fetch the weather forecast
        async function fetchForecast(location) {
            const coordinates = locationCoordinates[location];
            if (!coordinates) return;

            const apiUrl = `https://api.weather.gov/gridpoints/${coordinates.grid}/forecast`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error('Network response was not ok. API Response: ' + response.status);
                } else {
                    console.log('API Fetch was successful! Displaying API Data...');
                }
                const data = await response.json();
                displayForecast(data, coordinates.office);
                console.log(data);
            } catch (error) {
                console.error('There was a problem with the fetch operation:', error);
            }
        }

        // Function to display the forecast data
        function displayForecast(data, nwsOffice) {
            const daytimeContainer = document.querySelector('.daytime .forecast');
            const nighttimeContainer = document.querySelector('.nighttime .forecast');
            daytimeContainer.innerHTML = ''; // Clear existing content
            nighttimeContainer.innerHTML = ''; // Clear existing content

            // Get the last update time from updateTime instead of generatedAt
            const lastUpdateTime = data.properties.updateTime;
            const dateObj = new Date(lastUpdateTime);
            const parts = new Intl.DateTimeFormat('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                hour12: true,
                timeZone: 'America/Chicago',
                timeZoneName: 'short'
            }).formatToParts(dateObj);
            const get = type => parts.find(p => p.type === type).value;
            const dateString = dateObj.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                timeZone: 'America/Chicago'
            });
            const lastUpdateTimeFormatted = `${get('hour')}:${get('minute')} ${get('dayPeriod').toLowerCase()} ${get('timeZoneName')} ${dateString}`;
            const lastUpdateElement = document.getElementById('last-update');
            if (lastUpdateElement) {
                lastUpdateElement.innerHTML = `<a href="https://www.weather.gov/glossary/index.php?word=Last+update"><b>Last Update: </b></a>${lastUpdateTimeFormatted}`;
            }

            // Update the NWS office text and link
            const allParagraphs = document.querySelectorAll('p');
            for (const p of allParagraphs) {
                if (p.textContent.includes('Issued by:')) {
                    p.textContent = `Issued by: National Weather Service ${nwsOffice}, ${nwsOffice === 'Mobile' ? 'AL' : 'FL'}`;
                    break;
                }
            }

            // Update the NWS office link in the footer
            const nwsOfficeLink = document.querySelector('tr:last-child td a');
            if (nwsOfficeLink) {
                nwsOfficeLink.href = getNwsOfficeUrl(nwsOffice);
                nwsOfficeLink.textContent = `https://www.weather.gov/${nwsOffice.toLowerCase()}`;
            }

            // Separate daytime and nighttime forecasts
            const daytimeForecasts = data.properties.periods.filter(period => period.isDaytime);
            const nighttimeForecasts = data.properties.periods.filter(period => !period.isDaytime);

            // Append daytime forecasts
            daytimeForecasts.forEach(period => {
                const forecastItem = document.createElement('li');
                forecastItem.className = 'forecast-tombstone';
                forecastItem.innerHTML = `
                    <div>
                        <p class="txt-ctr-caps">${period.name}</p>
                        <p><img src="${period.icon}" alt="${period.shortForecast}" class="forecast-icon"></p>
                        <p class="point-forecast-icons-high">High: ${period.temperature} °F</p>
                        <p>${period.shortForecast}</p>
                    </div>
                `;
                daytimeContainer.appendChild(forecastItem);
            });

            // Append nighttime forecasts
            nighttimeForecasts.forEach(period => {
                const forecastItem = document.createElement('li');
                forecastItem.className = 'forecast-tombstone';
                forecastItem.innerHTML = `
                    <div>
                        <p class="txt-ctr-caps">${period.name}</p>
                        <p><img src="${period.icon}" alt="${period.shortForecast}" class="forecast-icon"></p>
                        <p class="point-forecast-icons-low">Low: ${period.temperature} °F</p>
                        <p>${period.shortForecast}</p>
                    </div>
                `;
                nighttimeContainer.appendChild(forecastItem);
            });
        }

        // Add event listener for location dropdown
        document.getElementById('location-dropdown').addEventListener('change', function(e) {
            const selectedLocation = e.target.value;
            if (selectedLocation) {
                const [city, state] = selectedLocation.split(',');
                document.getElementById('location-name').textContent = `${city}, ${state}`;
                fetchForecast(selectedLocation);
            }
        });

        // Initial load with default location
        window.onload = function() {
            const defaultLocation = 'Milton,FL';
            const [city, state] = defaultLocation.split(',');
            document.getElementById('location-dropdown').value = defaultLocation;
            document.getElementById('location-name').textContent = `${city}, ${state}`;
            fetchForecast(defaultLocation);
        };
    </script>
</body>
</html>
