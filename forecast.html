<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-Day Forecast 30.59°N 86.94°W (Text-Only)</title>
    <link rel="icon" type="image/png" sizes="512x512" href="Favicon.png">
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1300px;
            margin: 25px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .forecast-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .forecast-table th, .forecast-table td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: left;
        }

        .forecast {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            list-style-type: none;
            padding: 0;
        }

        .forecast-tombstone {
            width: 165px;
            margin: 5px;
            flex: 1 1 15px;
            text-align: center;
        }

        .forecast-icon {
            width: 50px;
            height: 50px;
        }

        .txt-ctr-caps {
            text-transform: capitalize;
            font-weight: bold;
        }

        .warn {
            color: red;
            font-weight: bold;
        }

        .daytime, .nighttime {
            display: flex; /* Use flexbox for horizontal layout */
            justify-content: space-around; /* Space items evenly */
            margin-bottom: 20px; /* Space between daytime and nighttime sections */
        }
        .back-button {
            position: absolute;
            top: 50px;
            left: 130px;
            text-decoration: none;
            color: #3498db;
            display: inline-block;
            padding: 8px 16px;
            border-radius: 4px;
            background: rgba(52, 152, 219, 0.1);
            transition: all 0.3s;
            font-size: 14px;
            z-index: 1000;
        }

        .back-button:hover {
            background: rgba(52, 152, 219, 0.2);
            color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button" title="Back to main dashboard">Return to Weather Dashboard</a>

        <h1>NWS Forecast for: Milton, FL</h1>
        <p>Issued by: National Weather Service Mobile, AL</p>
        <p id="last-update"><a href="https://www.weather.gov/glossary/index.php?word=Last+update"><b>Last Update: </b></a>3:14 pm CDT Apr 21, 2025</p>
        
        <table class="forecast-table">
            <tbody>
                <tr>
                    <td colspan="2" align="center">
                        <hr>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <div class="daytime">
                            <ul class="forecast">
                                <!-- Daytime forecast items will be dynamically added here -->
                            </ul>
                        </div>
                        <div class="nighttime">
                            <ul class="forecast">
                                <!-- Nighttime forecast items will be dynamically added here -->
                            </ul>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" align="left">
                        Milton, FL<br>
                        30.68°N 87.03°W (Elev. 66 ft)<br>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" align="left">
                        Visit your local NWS office at: <a href="https://www.weather.gov/mob">https://www.weather.gov/mob</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // Function to fetch the weather forecast
        async function fetchForecast() {
            const apiUrl = 'https://api.weather.gov/gridpoints/MOB/90,67/forecast';

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error('Network response was not ok. API Response: ' + response.status);
                } else{
                    console.log('API Fetch was successful! Displaying API Data...');
                }
                const data = await response.json();
                displayForecast(data);
                console.log(data)
            } catch (error) {
                console.error('There was a problem with the fetch operation:', error);
            }
        }

        // Function to display the forecast data
        function displayForecast(data) {
            const daytimeContainer = document.querySelector('.daytime .forecast');
            const nighttimeContainer = document.querySelector('.nighttime .forecast');
            daytimeContainer.innerHTML = ''; // Clear existing content
            nighttimeContainer.innerHTML = ''; // Clear existing content

            // Get the last update time
            const lastUpdateTime = data.properties.generatedAt;
            const dateObj = new Date(lastUpdateTime);
            const parts = new Intl.DateTimeFormat('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                hour12: true,
                timeZone: 'America/Chicago',
                timeZoneName: 'short'
            }).formatToParts(dateObj);
            const get = type => parts.find(p => p.type === type).value;
            const dateString = dateObj.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                timeZone: 'America/Chicago'
            });
            const lastUpdateTimeFormatted = `${get('hour')}:${get('minute')} ${get('dayPeriod').toLowerCase()} ${get('timeZoneName')} ${dateString}`;
            const lastUpdateElement = document.getElementById('last-update');
            if (lastUpdateElement) {
                lastUpdateElement.textContent = `Last Update: ${lastUpdateTimeFormatted}`;
            }

            // Separate daytime and nighttime forecasts
            const daytimeForecasts = data.properties.periods.filter(period => period.isDaytime);
            const nighttimeForecasts = data.properties.periods.filter(period => !period.isDaytime);

            // Append daytime forecasts
            daytimeForecasts.forEach(period => {
                const forecastItem = document.createElement('li');
                forecastItem.className = 'forecast-tombstone';
                forecastItem.innerHTML = `
                    <div>
                        <p class="txt-ctr-caps">${period.name}</p>
                        <p><img src="${period.icon}" alt="${period.shortForecast}" class="forecast-icon"></p>
                        <p class="point-forecast-icons-high">High: ${period.temperature} °F</p>
                        <p>${period.shortForecast}</p>
                    </div>
                `;
                daytimeContainer.appendChild(forecastItem);
            });

            // Append nighttime forecasts
            nighttimeForecasts.forEach(period => {
                const forecastItem = document.createElement('li');
                forecastItem.className = 'forecast-tombstone';
                forecastItem.innerHTML = `
                    <div>
                        <p class="txt-ctr-caps">${period.name}</p>
                        <p><img src="${period.icon}" alt="${period.shortForecast}" class="forecast-icon"></p>
                        <p class="point-forecast-icons-low">Low: ${period.temperature} °F</p>
                        <p>${period.shortForecast}</p>
                    </div>
                `;
                nighttimeContainer.appendChild(forecastItem);
            });
        }

        // Call the fetchForecast function when the page loads
        window.onload = fetchForecast;
    </script>
</body>
</html>
